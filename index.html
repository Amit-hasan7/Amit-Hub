<script>
var ICONS = {
  sports:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6c3.5 3.5 3.5 9.3 0 12.8M18.4 5.6c-3.5 3.5-3.5 9.3 0 12.8"/></svg>',
  movies:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>',
  anime:'<svg viewBox="0 0 24 24"><path d="m12 3 2.2 5.3L20 9l-4.3 3.9L17 19l-5-3-5 3 1.3-6.1L4 9l5.8-.7z"/></svg>'
};

var DATA = [
  {
    id:"sports",
    title:"Sports",
    color:"#fb7185",
    items:[
      {name:"StreamKing", url:"https://streamking.cx/"},
      {name:"StreamEast", url:"https://streameast.cool"}
    ]
  },
  {
    id:"movies",
    title:"Movies",
    color:"#fbbf24",
    items:[
      {name:"1Tube", url:"https://www.1tube.org"},
      {name:"RedFlix", url:"https://redflix.club"}
    ]
  },
  {
    id:"anime",
    title:"Anime",
    color:"#22d3ee",
    items:[
      {name:"Yenime", url:"https://yenime.net"},
      {name:"Enma", url:"https://www.enma.lol/home"}
    ]
  }
];

var main = document.getElementById("main");
DATA.forEach(function(c){
  var s = document.createElement("section");
  s.dataset.cat = c.id; s.style.setProperty("--c", c.color);
  var h = '<h2><i></i>'+c.title+'</h2><div class="grid">';
  c.items.forEach(function(it){
    h += '<a class="card" href="'+it.url+'" target="_blank" rel="noopener" data-name="'+it.name.toLowerCase()+'">'
      + '<div class="logo">'+ICONS[c.id]+'</div>'
      + '<div class="meta"><b>'+it.name+'</b><small>'+it.url.replace(/^https?:\/\//,"")+'</small></div>'
      + '<div class="go" aria-hidden="true">&#8599;</div></a>';
  });
  s.innerHTML = h + '</div>';
  main.appendChild(s);
});

var filter = "all", q = document.getElementById("q");

function apply(){
  var term = q.value.trim().toLowerCase(), shown = 0;
  document.querySelectorAll("section").forEach(function(s){
    var inCat = filter === "all" || s.dataset.cat === filter, n = 0;
    s.querySelectorAll(".card").forEach(function(a){
      var ok = inCat && (!term || a.dataset.name.indexOf(term) > -1 || s.dataset.cat.indexOf(term) > -1);
      a.style.display = ok ? "" : "none"; if(ok) n++;
    });
    s.style.display = n ? "" : "none"; shown += n;
  });
  document.getElementById("empty").style.display = shown ? "none" : "block";
}

document.querySelectorAll(".tab").forEach(function(b){
  b.onclick = function(){
    filter = b.dataset.f;
    document.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-pressed", t===b)});
    apply();
  };
});

q.addEventListener("input", apply);

document.addEventListener("pointermove", function(e){
  var c = e.target.closest && e.target.closest(".card"); if(!c) return;
  var r = c.getBoundingClientRect();
  c.style.setProperty("--mx", (e.clientX-r.left)+"px");
  c.style.setProperty("--my", (e.clientY-r.top)+"px");
});

document.getElementById("yr").textContent = new Date().getFullYear();

/* ---------- Liquid shader background ---------- */
(function(){
  var canvas = document.getElementById("liquid");
  if(!canvas) return;

  var gl = canvas.getContext("webgl", {antialias:false, alpha:false, powerPreference:"low-power"})
        || canvas.getContext("experimental-webgl");
  if(!gl){ canvas.style.display = "none"; return; }

  var vsSrc = [
    "attribute vec2 a_pos;",
    "void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }"
  ].join("\n");

  var fsSrc = [
    "precision highp float;",
    "uniform float u_time;",
    "uniform vec2  u_res;",
    "",
    "float hash(vec2 p){",
    "  p = fract(p * vec2(123.34, 456.21));",
    "  p += dot(p, p + 45.32);",
    "  return fract(p.x * p.y);",
    "}",
    "",
    "float noise(vec2 p){",
    "  vec2 i = floor(p);",
    "  vec2 f = fract(p);",
    "  vec2 u = f * f * (3.0 - 2.0 * f);",
    "  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),",
    "             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);",
    "}",
    "",
    "float fbm(vec2 p){",
    "  float v = 0.0;",
    "  float a = 0.5;",
    "  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);",
    "  for(int i = 0; i < 4; i++){",
    "    v += a * noise(p);",
    "    p = rot * p * 2.0;",
    "    a *= 0.5;",
    "  }",
    "  return v;",
    "}",
    "",
    "void main(){",
    "  vec2 uv = gl_FragCoord.xy / u_res;",
    "  vec2 p  = uv * vec2(u_res.x / u_res.y, 1.0) * 2.2;",
    "  float t = u_time * 0.16;",
    "",
    "  // Domain-warped FBM for liquid flow",
    "  vec2 q = vec2(fbm(p + t), fbm(p + vec2(5.2, 1.3) + t * 0.8));",
    "  vec2 r = vec2(fbm(p + 4.0 * q + vec2(1.7, 9.2) + t * 0.6),",
    "                fbm(p + 4.0 * q + vec2(8.3, 2.8) + t * 0.5));",
    "  float f = fbm(p + 3.5 * r);",
    "",
    "  vec3 bg     = vec3(0.039, 0.039, 0.071); // #0a0a12",
    "  vec3 violet = vec3(0.545, 0.361, 0.965); // #8b5cf6",
    "  vec3 cyan   = vec3(0.133, 0.827, 0.933); // #22d3ee",
    "",
    "  vec3 color = mix(bg, violet, f * 0.55);",
    "  color = mix(color, cyan, pow(length(r) * 0.5, 1.4) * 0.32);",
    "",
    "  // Radial vignette — brighter toward the center",
    "  float d = length(uv - 0.5);",
    "  color *= mix(0.35, 1.0, smoothstep(0.75, 0.0, d));",
    "",
    "  // Slight film grain to hide banding",
    "  float grain = (hash(gl_FragCoord.xy + u_time) - 0.5) * 0.025;",
    "  color += grain;",
    "",
    "  gl_FragColor = vec4(color, 1.0);",
    "}"
  ].join("\n");

  function compile(type, src){
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      console.warn("Shader error:", gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  var vs = compile(gl.VERTEX_SHADER, vsSrc);
  var fs = compile(gl.FRAGMENT_SHADER, fsSrc);
  if(!vs || !fs){ canvas.style.display = "none"; return; }

  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    console.warn("Program link error:", gl.getProgramInfoLog(prog));
    canvas.style.display = "none";
    return;
  }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  var aPos = gl.getAttribLocation(prog, "a_pos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var uTime = gl.getUniformLocation(prog, "u_time");
  var uRes  = gl.getUniformLocation(prog, "u_res");

  var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function resize(){
    var w = Math.max(1, Math.floor(window.innerWidth  * dpr));
    var h = Math.max(1, Math.floor(window.innerHeight * dpr));
    if(canvas.width !== w || canvas.height !== h){
      canvas.width  = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
      gl.uniform2f(uRes, w, h);
    }
  }
  window.addEventListener("resize", resize, {passive:true});
  resize();

  var start = performance.now();
  var rafId = 0;

  function frame(now){
    var t = reducedMotion ? 0 : (now - start) * 0.001;
    gl.uniform1f(uTime, t);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    if(!reducedMotion) rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);

  // Pause when tab is hidden, resume when visible
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){
      cancelAnimationFrame(rafId);
    } else if(!reducedMotion){
      start = performance.now() - 1; // resume from ~0
      rafId = requestAnimationFrame(frame);
    }
  });
})();
</script>
